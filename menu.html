<script>
const items = [
  { name: 'Big Samosa', price: 600, unit: '/12', variant: 'card--sunset', img: 'samosa big.webp', desc: ' Our samosas are the best because we only use premium Dalda Banaspati to fry them, making them golden and crispy, not greasy. We fill them with high-quality ingredients and make sure everything is clean and hygienic.', link: 'product-big-samosa.html' },
  { name: 'Small Samosa', price: 350, unit: '/12', variant: 'card--yellow', img: 'samosa.webp', desc: 'Mini samosas for light snacking.', link: 'product-small-samosa.html' },
  { name: 'Makhan Jalebi', price: 800, unit: '/kg', variant: 'card--orange', img: 'jalebi.webp', desc: 'Our jalebis are made with the best ingredients and fried to a perfect crisp in premium Dalda Banaspati. They are sweet and delicious, giving you the traditional taste you love, made with the highest quality standards.', link: 'product-jalebi.html' },
  { name: 'Pakoray', price: 800, unit: '/kg', variant: 'card--golden', img: 'pakoray.webp', desc: 'We make our pakoray with pure basin and other top-quality ingredients. They are fried in premium Dalda Banaspati so they are crispy and flavorful, not heavy or oily. We always follow strict hygiene rules.', link: 'product-pakoray.html' },
  { name: 'Chicken Roll', price: 480, unit: '/6', variant: 'card--spice', img: 'chicken roll.webp', desc: 'Our chicken rolls are a customer favourite because they are filled with pure, juicy chicken—no other fillers. We fry them in premium Dalda Banaspati and prepare everything under strict hygienic conditions.', link: 'product-chicken-roll.html' },
  { name: 'Namak Paray', price: 800, unit: '/kg', variant: 'card--lavender', img: 'namak pary.webp', desc: 'Craving a salty crunch? Our namak pary are the perfect snack. We make them using the best ingredients and fry them in premium Dalda Banaspati, so they are crispy and delicious, not greasy.', link: 'product-namak-paray.html' },
  { name: 'Shakar Paray', price: 800, unit: '/kg', variant: 'card--leaf', img: 'shakar pary.webp', desc: 'For a sweet treat, try our shakar pary. They are made with quality ingredients, so you get a sweet, crispy snack that is clean and safe to eat.', link: 'product-shakar-paray.html' },
  { name: 'Frozen Chicken Roll', price: 420, unit: '/6', variant: 'card--mint', img: 'frozen chicken roll.webp', desc: 'Craving our chicken rolls? Keep a pack in your freezer! These are filled with only pure chicken and no fillers. You can fry them yourself in premium Dalda Banaspati for a fresh, hot, and healthy snack anytime you want.', link: 'product-frozen-chicken-roll.html' },
  { name: 'Frozen Samosa', price: 240, unit: '/12', variant: 'card--mint-2', img: 'frozen samosa.webp', desc: 'Enjoy our famous samosas at home! We make them with the same high-quality ingredients and strict hygiene as our fresh ones. Just fry them in premium Dalda Banaspati whenever you like for a crispy, healthy, and delicious snack', link: 'product-frozen-samosa.html' },
  { name: 'Samosa Patti', price: 400, unit: '/kg', variant: 'card--rose', img: 'samosa patti.webp', desc: 'Thin sheets for making samosas.', link: 'product-samosa-patti.html' }
];

const menu = document.getElementById('menu');
const cartCount = document.getElementById('cart-count');

const updateCount = () => {
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const c = cart.reduce((sum, item) => sum + item.qty, 0);
  cartCount.innerText = c;
};

items.forEach(item => {
  const c = document.createElement('div');
  c.className = `card ${item.variant}`;
  c.innerHTML = `
    <div class="left">
      <div class="title">${item.name}</div>
      <div class="desc">${item.desc}</div>
      <a href="${item.link}" class="read-more">Read more</a>
    </div>
    <div class="right">
      <img src="${item.img}" alt="${item.name} from Parsa Refreshment in Jinnah Garden, also serving Soan Garden, Naval Anchorage, PWD and Gulberg Green Islamabad">
      <div class="price">PKR ${item.price} ${item.unit}</div
    </div>
    <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>
  `;
  menu.appendChild(c);
});


document.addEventListener("click", function(e) {
  if (e.target.classList.contains("read-more")) {
    const desc = e.target.previousElementSibling;
    if (desc.classList.contains("expanded")) {
      desc.classList.remove("expanded");
      e.target.textContent = "Read more";
    } else {
      desc.classList.add("expanded");
      e.target.textContent = "Read less";
    }
  }
});


function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const itemIndex = cart.findIndex(item => item.name === name);

  if (itemIndex > -1) {
    cart[itemIndex].qty += 1;
  } else {
    cart.push({ name, price, qty: 1 });
  }
  
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCount();
  goCart();
}

function goCart() {
  window.location.href = 'cart.html';
}

updateCount();
</script>
